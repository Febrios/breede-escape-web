info:
  name: Fetch Story
  type: http
  seq: 4

http:
  method: GET
  url: https://{{sanity_project_id}}.api.sanity.io/:version/data/query/{{sanity_dataset}}?query=*[_type == "storySettings"]{_id, content, image { asset->{url} }, badges[]{ icon, url, title }}
  params:
    - name: query
      value: '*[_type == "storySettings"]{_id, content, image { asset->{url} }, badges[]{ icon, url, title }}'
      type: query
    - name: version
      value: v2024-04-08
      type: path
  auth:
    type: bearer
    token: "{{sanity_api_token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
