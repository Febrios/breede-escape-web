info:
  name: Fetch Hero
  type: http
  seq: 3

http:
  method: GET
  url: https://{{sanity_project_id}}.api.sanity.io/:version/data/query/{{sanity_dataset}}?query=*[_type == "heroSettings"]{_id, content, backgroundImage}
  params:
    - name: query
      value: '*[_type == "heroSettings"]{_id, content, backgroundImage}'
      type: query
    - name: version
      value: v2024-04-08
      type: path
  auth:
    type: bearer
    token: "{{sanity_api_token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
