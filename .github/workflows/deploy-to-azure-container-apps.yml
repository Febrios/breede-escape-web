name: Deploy to Azure Container Apps

on:
  push:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/breede-escape-web
  NODE_VERSION: '20'

jobs:
  infra:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy infrastructure (Bicep)
        run: |
          LOCATION=$(az group show --name "${{ secrets.AZURE_RESOURCE_GROUP }}" --query location -o tsv)
          az deployment group create \
            --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" \
            --template-file infra/container-app.bicep \
            --parameters \
              location="$LOCATION" \
              containerAppName="${{ secrets.AZURE_CONTAINER_APP }}" \
              containerAppEnvironmentName="${{ secrets.AZURE_CONTAINER_ENVIRONMENT }}" \
              registryServer="ghcr.io" \
              registryUsername="${{ github.repository_owner }}" \
              registryPassword="${{ secrets.GHCR_TOKEN }}" \
              nextPublicSanityProjectId="${{ secrets.NEXT_PUBLIC_SANITY_PROJECT_ID }}" \
              nextPublicSanityDataset="${{ secrets.NEXT_PUBLIC_SANITY_DATASET }}" \
              googleServiceAccountJson="${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}" \
              googlePlacesApiKey="${{ secrets.GOOGLE_PLACES_API_KEY }}" \
              googlePlaceId="${{ secrets.GOOGLE_PLACE_ID }}"

  build-and-push:
    needs: infra
    runs-on: ubuntu-latest
    outputs:
      latest_tag: ${{ steps.meta.outputs.LATEST_TAG }}
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Docker image tag
        id: meta
        run: |
          TIMESTAMP=$(date +%s)
          SHORT_SHA=${{ github.sha }}
          SHORT_SHA=${SHORT_SHA:0:7}
          OWNER_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          IMAGE_BASE="${{ env.REGISTRY }}/${OWNER_LOWER}/breede-escape-web"
          TAG="${IMAGE_BASE}:${{ github.ref_name }}-${SHORT_SHA}-${TIMESTAMP}"
          LATEST_TAG="${IMAGE_BASE}:latest"
          echo "IMAGE_BASE=${IMAGE_BASE}" >> $GITHUB_OUTPUT
          echo "IMAGE_TAG=${TAG}" >> $GITHUB_OUTPUT
          echo "LATEST_TAG=${LATEST_TAG}" >> $GITHUB_OUTPUT
          echo "SHORT_SHA=${SHORT_SHA}" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ steps.meta.outputs.IMAGE_TAG }}
            ${{ steps.meta.outputs.LATEST_TAG }}
          build-args: |
            NEXT_PUBLIC_SANITY_PROJECT_ID=${{ secrets.NEXT_PUBLIC_SANITY_PROJECT_ID }}
            NEXT_PUBLIC_SANITY_DATASET=${{ secrets.NEXT_PUBLIC_SANITY_DATASET }}


  deploy:
    needs: [infra, build-and-push]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure Container Apps
        uses: azure/container-apps-deploy-action@v1
        with:
          resourceGroup: ${{ secrets.AZURE_RESOURCE_GROUP }}
          containerAppName: ${{ secrets.AZURE_CONTAINER_APP }}
          containerAppEnvironment: ${{ secrets.AZURE_CONTAINER_ENVIRONMENT }}
          imageToDeploy: ${{ needs.build-and-push.outputs.latest_tag }}
          registryUrl: ghcr.io
          registryUsername: ${{ github.repository_owner }}
          registryPassword: ${{ secrets.GHCR_TOKEN }}

      - name: Notify deployment
        if: success()
        run: |
          echo "✅ Successfully deployed"
          echo "App URL: https://${{ secrets.AZURE_CONTAINER_APP_URL }}"
